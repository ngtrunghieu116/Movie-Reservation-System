# ==========================================
# TEST CONFIGURATION (movie_reservation_test_db)
# ==========================================
server.port=8081
spring.application.name=movie-reservation-test

# 1. TEST DATABASE CONFIGURATION (Dedicated MySQL Test Database)
spring.datasource.url=jdbc:mysql://localhost:3306/movie_reservation_test_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# 2. JPA & HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# 3. LOGGING
logging.level.org.springframework.security=WARN
logging.level.com.moviebooking=INFO
logging.level.org.hibernate.SQL=WARN

# 4. CUSTOM APP CONFIGURATION
app.upload.poster-dir=uploads/test-posters/
app.upload.product-dir=uploads/test-products/
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# 5. JWT CONFIGURATION
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# 6. MAIL CONFIGURATION (Satisfies JavaMailSender bean)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@gmail.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 7. OAUTH2 CONFIGURATION
spring.security.oauth2.client.registration.google.client-id=891967049412-test.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=test-secret

# 8. RESET TOKEN
app.reset-token.expiration=900000
app.frontend.url=http://localhost:3000
app.frontend.reset-password-url=http://localhost:3000/reset-password

# 9. SHOWTIME & CRAWLER
app.showtime.buffer-time-minutes=15
app.primary-theater-id=1
crawler.base-url=https://chieuphimquocgia.com.vn
crawler.timeout=30000

# Disable crawler/scheduler background runs during tests
crawler.schedule.cron=-
movie.status.schedule.cron=-

# 10. VNPAY SANDBOX
vnpay.tmn-code=SANDBOX_TEST_CODE
vnpay.hash-secret=SANDBOX_TEST_SECRET
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payments/vnpay/return
