server:
  port: 8080

spring:
  application:
    name: movie-reservation

  # === DATABASE ===
  datasource:
    url: jdbc:mysql://localhost:3306/movie_reservation_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # === JPA / HIBERNATE ===
  jpa:
    hibernate:
      ddl-auto: update          # Tự tạo/cập nhật schema từ Entity
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # === THYMELEAF ===
  thymeleaf:
    cache: false                # Dev mode: tắt cache để hot reload
    prefix: classpath:/templates/
    suffix: .html

  # === FILE UPLOAD ===
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# === CUSTOM PROPERTIES ===
app:
  upload:
    poster-dir: uploads/posters/
    product-dir: uploads/products/
