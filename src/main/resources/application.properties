spring.application.name=movie-reservation

# ==========================================
# 2. DATABASE CONFIGURATION (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/movie_reservation_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
